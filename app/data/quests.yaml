# The quest catalog — the only place XP/coin values are allowed to live.
# `scripts/seed.py` upserts this into the `quests` table by `id`; the server
# always re-reads values from the DB (never trusts a client-sent XP amount).
#
# ⚠️ Starter set, not final. These are placeholder quests/values sized by
# category (main > side > health > leisure), not ported from a prototype —
# there wasn't one in this repo yet. Tune ids, titles, and numbers freely;
# nothing downstream hardcodes them.
#
# stat_key feeds achievements.yaml (Sprint 2) — it's the counter an
# achievement threshold checks against, e.g. "unlock 'PR Veteran' at
# prs_merged >= 10". Leave it null for quests that shouldn't feed a counter.

quests:
  # --- Main: the big, effortful stuff ---
  - id: ml_study
    category: main
    title: "Study ML (deep work session)"
    xp: 150
    coins: 15
    stat_key: ml_sessions

  - id: dsa_practice
    category: main
    title: "DSA practice session"
    xp: 100
    coins: 10
    stat_key: dsa_solved

  - id: open_source_pr
    category: main
    title: "Ship an open-source PR"
    xp: 200
    coins: 25
    stat_key: prs_merged

  - id: security_research
